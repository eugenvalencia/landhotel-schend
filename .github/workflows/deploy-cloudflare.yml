name: Deploy zu Cloudflare Pages

# Bei jedem Push auf main wird gebaut und nach Cloudflare Pages deployed.
# Branches/PRs werden als Preview-Deploys publiziert (preview-URL im PR-Comment).
#
# Voraussetzungen (Repo-Secrets):
#   CLOUDFLARE_API_TOKEN — Account-Token mit Permission "Account.Cloudflare Pages: Edit"
#                          (zone-scoped Token reicht NICHT — Pages braucht Account-Level)
#   CLOUDFLARE_ACCOUNT_ID — 93a6fc988f6bf06f077c05fa630cd5df
#   (Beide einmalig setzen unter Settings → Secrets and variables → Actions)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Cloudflare Pages Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Öffentliche Seite = Astro SSG (DR-029, srcDir ./site → dist-astro).
      # Bringt public/_redirects + die Pages Function functions/api/inquiry mit.
      # Die Buchungs-ANFRAGE läuft rein über Astro + Cloudflare (Mail via Resend) —
      # KEINE React/Supabase-Strecke mehr (Supabase aus dem Gast-Pfad entfernt).
      - name: Astro build (öffentliche SSG-Seite)
        run: npm run build:site

      - name: Deploy zu Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-astro --project-name=landhotel-schend --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Geprüft wird die Adresse, unter der Gäste die Seite wirklich aufrufen.
      # Vorher stand hier schend.conexadigital.eu — diesen Host gibt es nicht
      # mehr, curl brach mit Code 6 ab (Name nicht auflösbar), und JEDER Deploy
      # wurde seit mindestens 25.07.2026 als fehlgeschlagen gemeldet, obwohl er
      # lief. Das ist die teurere Sorte Fehler: ein ECHTER Fehlschlag hätte
      # genauso ausgesehen und wäre als bekanntes Rauschen abgetan worden.
      #
      # -L folgt der 308-Weiterleitung auf den Schrägstrich (/anfrage →
      # /anfrage/). Ohne -L prüft man die Weiterleitung statt der Seite.
      - name: Verifikation HTTPS (nur auf main)
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 8
          SEITE=https://landhaus-schend.de/
          HTTP=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$SEITE")
          TITLE=$(curl -sL --max-time 20 "$SEITE" | grep -oE '<title[^>]*>[^<]+</title>' | head -1 | sed 's/<[^>]*>//g')
          echo "::notice::HTTP $HTTP — $TITLE"
          [ "$HTTP" = "200" ]
          # Gegenprobe: 200 allein beweist nur, dass irgendetwas antwortet.
          # Das Anfrageformular ist die Seite, an der Geld hängt — es muss da sein.
          ANFRAGE=$(curl -sL --max-time 20 "https://landhaus-schend.de/anfrage/")
          echo "$ANFRAGE" | grep -q 'id="anfrage-form"' || {
            echo "::error::Anfrageformular fehlt auf /anfrage/ — Deploy ist nicht brauchbar"
            exit 1
          }
